:root{--blue:#1d4ed8;--blue2:#2563eb;--navy:#1e3a8a;--red:#c8102e;--red2:#e11d48;--green:#16a34a;--amber:#d97706;--purple:#7c3aed;--teal:#0d9488;--sky:#0284c7;
--bg:#f1f5fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#e2e8f0;--radius:18px;--shadow:0 6px 22px rgba(30,58,138,.10),0 1px 3px rgba(30,58,138,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'NunitoApp','Nunito','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100vh}
h1,h2,h3,.fred{font-family:'FredokaApp','Fredoka','Trebuchet MS',system-ui,sans-serif;font-weight:600;letter-spacing:.005em}
.fr{font-family:'NunitoApp','Nunito',system-ui,sans-serif;font-weight:700;color:var(--navy)}
.ipa{font-family:'AndikaApp','Andika','Doulos SIL','Charis SIL','Lucida Sans Unicode','Arial Unicode MS','DejaVu Sans',sans-serif;color:#7c3aed;font-weight:400;white-space:nowrap}
button{font:inherit;cursor:pointer}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:4px solid var(--red);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.topbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
.logo .badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--red),#ef4444);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'FredokaApp',sans-serif;font-weight:700;font-size:24px;box-shadow:0 3px 0 #9f0d24}
.logo .t1{font-family:'FredokaApp',sans-serif;font-weight:600;font-size:20px;color:var(--navy);line-height:1.1}
.logo .t2{font-size:13px;color:var(--muted)}
.topbar .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.pbar{width:150px;height:12px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#4ade80);border-radius:99px;transition:width .6s}
main{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* hero */
.hero{background:linear-gradient(135deg,#dbeafe 0%,#eff6ff 55%,#fff 100%);border-radius:24px;padding:26px 28px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{margin:0;font-size:34px;color:var(--red);line-height:1.1}
.hero p{margin:8px 0 0;color:#334155}
.hero .kids{display:flex;align-items:flex-end;margin-left:auto;flex:0 0 auto}
.hero .kids svg{width:84px;height:auto;margin-left:-14px}
.flag{display:inline-flex;width:30px;height:20px;border-radius:3px;overflow:hidden;vertical-align:-3px;margin-right:6px;box-shadow:0 0 0 1px #e5e7eb}
.flag i{flex:1}.flag i:nth-child(1){background:#1d4ed8}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#ef4444}
.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.section-title .bar{width:42px;height:8px;border-radius:4px;background:var(--navy)}
.section-title h2{margin:0;font-size:24px;color:var(--navy)}
/* chapter grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.chap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border:0;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .15s,box-shadow .15s;border-top:6px solid var(--c,#2563eb);color:inherit}
.chap:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(30,58,138,.16)}
.chap .num{font-family:'FredokaApp',sans-serif;font-size:13px;color:var(--c);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.chap .q{font-size:19px;font-weight:800;color:var(--navy);line-height:1.25}
.chap .de{font-size:15px;color:var(--muted)}
.chap .st{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
.chap .mini{flex:1;height:8px;border-radius:9px;background:#eef2f7;overflow:hidden}.chap .mini i{display:block;height:100%;background:var(--c)}
.check{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#e2e8f0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.check.on{background:var(--green);animation:pop .4s}
.chap.test{--c:#c8102e;background:linear-gradient(135deg,#fff1f2,#fff)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center}
/* buttons */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:17px;background:var(--blue2);color:#fff;box-shadow:0 4px 0 #1e40af;transition:transform .08s,box-shadow .08s,background .2s;display:inline-flex;align-items:center;gap:8px;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e40af}
.btn.red{background:var(--red);box-shadow:0 4px 0 #9f0d24}.btn.green{background:var(--green);box-shadow:0 4px 0 #15803d}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 0 0 2px #cbd5e1 inset,0 3px 0 #cbd5e1}
.btn.small{padding:7px 14px;font-size:15px;min-height:38px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.speak{border:0;background:#e0f2fe;color:var(--sky);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .2s,transform .1s}
.speak:hover{background:#bae6fd}.speak:active{transform:scale(.92)}.speak svg{width:20px;height:20px}
.speak.playing{background:var(--sky);color:#fff}
.no-tts .speak{display:none!important}
/* lesson */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lesson-head{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px 24px;border-left:10px solid var(--c);display:flex;gap:18px;align-items:center}
.lesson-head .big{font-size:30px;font-weight:900;color:var(--navy);line-height:1.2}
.lesson-head .de{font-size:19px;color:#475569;margin-top:2px}
.lesson-head .kid svg{width:90px;height:auto}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-top:16px}
.card h3{margin:0 0 10px;font-size:21px;color:var(--navy);display:flex;align-items:center;gap:10px}
.card h3 .ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#eff6ff;flex:0 0 auto}
.merk{border-radius:var(--radius);padding:16px 20px;margin-top:16px;border:3px solid #f59e0b;background:#fffbeb}
.merk h3{margin:0 0 8px;color:#b45309;font-size:20px}
.merk.blue{border-color:#93c5fd;background:#eff6ff}.merk.blue h3{color:var(--blue)}
.attn{border-radius:var(--radius);padding:14px 18px;margin-top:16px;background:#fef2f2;border-left:8px solid var(--red2)}
.attn h3{margin:0 0 6px;color:var(--red);font-size:20px}
.attn ul,.merk ul,.card ul{margin:6px 0 0;padding-left:22px}.attn li,.merk li,.card li{margin:4px 0}
.tip{border-radius:14px;padding:12px 16px;margin-top:12px;background:#ecfeff;border-left:6px solid #06b6d4;font-size:16px}
.new{display:inline-block;background:#fde68a;color:#92400e;font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;vertical-align:2px;margin-left:4px;text-transform:uppercase;letter-spacing:.05em}
/* bauplan */
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:6px 0}
.blk{border-radius:12px;padding:8px 14px 6px;text-align:center;color:#fff;font-weight:800;font-size:20px;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:pop .4s both}
.blk small{display:block;font-weight:600;font-size:12.5px;opacity:.92;margin-top:2px;font-family:'NunitoApp',sans-serif}
.b-q{background:#c8102e}.b-v{background:#16a34a}.b-p{background:#2563eb}.b-o{background:#d97706}.b-x{background:#7c3aed}.b-g{background:#64748b}.b-t{background:#0d9488}
.plan .arrow{align-self:center;color:#94a3b8;font-size:22px;font-weight:900}
.plan .mark{align-self:center;font-size:26px;font-weight:900;color:var(--navy)}
.legend{font-size:14px;color:var(--muted);margin-top:4px}
/* dialog */
.dlg{background:linear-gradient(180deg,#f8fafc,#fff);border:2px solid #e2e8f0;border-radius:18px;padding:14px;margin-top:12px}
.dlg .row{display:flex;align-items:flex-end;gap:10px;margin:8px 0}
.dlg .row.r{flex-direction:row-reverse}
.dlg .av{flex:0 0 56px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.dlg .av svg{width:56px;height:auto;display:block}
.bub{position:relative;background:#fff;border:2px solid #cbd5e1;border-radius:18px;padding:9px 14px;max-width:min(560px,80%);box-shadow:0 2px 0 #e2e8f0;display:flex;align-items:center;gap:8px}
.row .bub{border-bottom-left-radius:4px}.row.r .bub{border-bottom-left-radius:18px;border-bottom-right-radius:4px;background:#eff6ff;border-color:#bfdbfe}
.bub .tx{font-weight:700;color:var(--navy)}
.bub .tx .deu{display:block;font-weight:500;color:var(--muted);font-size:15px}
.dlg .head{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:700}
.hl-q{color:#c8102e}.hl-v{color:#16a34a}.hl-p{color:#2563eb}.hl-o{color:#d97706}
/* exercises */
.ex-wrap{max-width:820px;margin:0 auto}
.ex-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ex-top .pbar{flex:1;width:auto}
.ex-card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px 24px;position:relative}
.ex-type{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c,#2563eb);background:color-mix(in srgb,var(--c,#2563eb) 12%,#fff);padding:4px 10px;border-radius:99px}
.ex-q{font-size:21px;font-weight:800;margin:12px 0 4px;line-height:1.35}
.ex-sub{color:var(--muted);font-size:16px;margin-bottom:12px}
.prompt{font-size:22px;font-weight:800;color:var(--navy);background:#f8fafc;border:2px dashed #cbd5e1;border-radius:14px;padding:12px 16px;margin:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.opt{border:2px solid #cbd5e1;background:#fff;border-radius:14px;padding:12px 16px;text-align:left;font-size:18px;font-weight:700;color:var(--navy);transition:border-color .15s,background .15s,transform .1s;box-shadow:0 3px 0 #e2e8f0;min-height:52px}
.opt:hover{border-color:#93c5fd;background:#f8fbff}
.opt.sel{border-color:var(--blue2);background:#eff6ff;box-shadow:0 3px 0 #bfdbfe}
.opt.ok{border-color:var(--green);background:#dcfce7;box-shadow:0 3px 0 #86efac}
.opt.bad{border-color:var(--red2);background:#fee2e2;box-shadow:0 3px 0 #fecaca;animation:shake .35s}
.opt:disabled{cursor:default}
.gapsel{font:inherit;font-weight:800;color:var(--blue);border:2px solid #93c5fd;border-radius:10px;padding:3px 8px;background:#eff6ff;margin:0 3px;max-width:100%}
.gapsel.ok{border-color:var(--green);background:#dcfce7;color:#15803d}.gapsel.bad{border-color:var(--red2);background:#fee2e2;color:#b91c1c}
.gaptext{font-size:21px;line-height:2.1;font-weight:700;color:var(--navy)}
.inp{width:100%;font:inherit;font-size:20px;font-weight:700;color:var(--navy);border:2px solid #cbd5e1;border-radius:14px;padding:12px 14px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--blue2);box-shadow:0 0 0 4px #dbeafe}
.inp.ok{border-color:var(--green);background:#f0fdf4}.inp.bad{border-color:var(--red2);background:#fef2f2}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acc button{border:2px solid #cbd5e1;background:#fff;border-radius:10px;min-width:42px;height:40px;font-weight:800;font-size:18px;color:var(--navy)}
.acc button:active{background:#eff6ff}
/* order */
.zone{min-height:62px;border:3px dashed #93c5fd;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f8fbff;transition:background .15s}
.zone.over{background:#dbeafe}
.zone.empty::before{content:attr(data-ph);color:#94a3b8;font-size:15px;padding:0 6px}
.pool{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:8px;border-radius:16px;background:#f1f5f9}
.tok{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:19px;background:#fff;color:var(--navy);box-shadow:0 3px 0 #cbd5e1,0 0 0 2px #e2e8f0 inset;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .12s}
.tok:hover{transform:translateY(-2px)}
.tok.dragging{opacity:.4}
.zone .tok{background:#fff7ed;box-shadow:0 3px 0 #fdba74,0 0 0 2px #fed7aa inset}
.zone.ok{border-color:var(--green);background:#f0fdf4}.zone.bad{border-color:var(--red2);background:#fef2f2}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid #cbd5e1;background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:17px;color:var(--navy);text-align:left;min-height:52px;box-shadow:0 3px 0 #e2e8f0;position:relative;transition:all .15s}
.mi.sel{border-color:var(--blue2);background:#eff6ff}
.mi .tag{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:900}
.mi.ok{border-color:var(--green)!important;background:#f0fdf4!important}.mi.bad{border-color:var(--red2)!important;background:#fef2f2!important}
/* picture */
.room{width:100%;max-width:640px;display:block;margin:6px auto;border-radius:18px;border:3px solid #fde68a;background:#fff}
.room .ri{cursor:pointer;transition:transform .15s,filter .15s;transform-box:fill-box;transform-origin:center}
.room .ri:hover{filter:drop-shadow(0 0 6px #60a5fa)}
.room .ri.ok{filter:drop-shadow(0 0 7px #22c55e) drop-shadow(0 0 3px #22c55e)}
.room .ri.bad{filter:drop-shadow(0 0 7px #ef4444)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipc{border:2px solid #cbd5e1;background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;font-size:17px;color:var(--navy);box-shadow:0 2px 0 #e2e8f0}
.chipc.sel{border-color:var(--blue2);background:#dbeafe}
.chipc.ok{border-color:var(--green);background:#dcfce7}.chipc.bad{border-color:var(--red2);background:#fee2e2}.chipc.miss{border-color:var(--amber);background:#fef3c7}
/* feedback */
.fb{margin-top:16px;border-radius:16px;padding:14px 18px;display:none;gap:12px;align-items:flex-start;animation:fade .3s}
.fb.show{display:flex}
.fb.ok{background:#dcfce7;border:2px solid #86efac}.fb.bad{background:#fee2e2;border:2px solid #fca5a5}
.fb .ico{flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900}
.fb.ok .ico{background:var(--green)}.fb.bad .ico{background:var(--red2)}
.fb .ttl{font-family:'FredokaApp',sans-serif;font-size:20px;font-weight:600}
.fb.ok .ttl{color:#15803d}.fb.bad .ttl{color:#b91c1c}
.fb .sol{font-weight:800;color:var(--navy);margin-top:3px}
.fb .why{margin-top:4px;font-size:16px;color:#334155}
.fb .warnacc{margin-top:6px;background:#fef3c7;border-radius:10px;padding:6px 10px;font-size:15.5px;color:#92400e}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
/* results */
.result{text-align:center;padding:28px 20px}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.stars .s{color:#e2e8f0;display:inline-block}.stars .s.on{color:#f59e0b;animation:pop .5s both}
.medal{display:block;width:120px;height:120px;margin:12px auto 0;position:relative}
.score{font-family:'FredokaApp',sans-serif;font-size:44px;color:var(--navy);font-weight:600}
.review{text-align:left;margin-top:18px}
.review .it{display:flex;align-items:center;gap:12px;background:#fff7ed;border-radius:14px;padding:10px 14px;margin-top:8px;flex-wrap:wrap}
.review .it .t{flex:1;min-width:180px}
.qw{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:8px}
.qw .w{border-radius:14px;padding:10px 12px;color:#fff;text-align:center}
.qw .w b{display:block;font-size:22px}
.qw .w span{font-size:15px;opacity:.95}
table.t{border-collapse:collapse;width:100%;font-size:17px}
table.t td,table.t th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#eff6ff;color:var(--navy);font-family:'FredokaApp',sans-serif;font-weight:500}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
.way{border-radius:16px;padding:14px;background:#f8fafc;border:2px solid #e2e8f0}
.way .n{width:32px;height:32px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin-right:6px}
.way h4{margin:0 0 6px;font-size:18px;font-family:'FredokaApp',sans-serif;font-weight:600;color:var(--navy);display:flex;align-items:center}
.intonation{display:block;width:100%;max-width:260px;height:auto;margin:6px 0}
.footer{margin-top:40px;text-align:center;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1e293b;color:#fff;border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;animation:fade .3s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:700px){
 body{font-size:17px}
 .topbar .in{padding:8px 12px;gap:8px}
 .logo .t2{display:none}.logo .t1{font-size:17px}.logo .badge{width:38px;height:38px;font-size:20px}
 .pbar{width:70px}
 main{padding:14px 12px 70px}
 .hero{flex-direction:column;align-items:flex-start;padding:20px}
 .hero h1{font-size:27px}
 .hero .kids{margin-left:0;align-self:center}
 .hero .kids svg{width:66px}
 .lesson-head{flex-direction:column;align-items:flex-start;padding:18px}
 .lesson-head .big{font-size:24px}
 .lesson-head .kid{display:none}
 .ex-card{padding:16px}
 .ex-q{font-size:19px}
 .prompt,.gaptext{font-size:19px}
 .match{grid-template-columns:1fr 1fr;gap:8px}
 .mi{font-size:15px;padding:8px 10px}
 .blk{font-size:17px;padding:7px 10px 5px}
 .dlg .av{flex-basis:44px}.dlg .av svg{width:44px}
 .bub{max-width:85%}
 .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

lesson:`
<div class="card"><h3><span class="ic">💬</span>Fragen stellen – drei Wege</h3>
<p>Im Französischen kannst du auf verschiedene Arten fragen. In deinem Buch kommen diese drei vor:</p>
<div class="ways">
 <div class="way"><h4><span class="n" style="background:#2563eb">1</span>Stimme heben ↗</h4>
  Du sagst einen ganz normalen Satz – aber am Ende geht deine Stimme <b>nach oben</b>. Schon ist es eine Frage!
  <div class="tip" style="margin-top:8px"><span class="fr">Tu es de Strasbourg.</span> ↘ = Du bist aus Straßburg.<br><span class="fr">Tu es de Strasbourg?</span> ↗ = Bist du aus Straßburg?</div></div>
 <div class="way"><h4><span class="n" style="background:#c8102e">2</span>Mit Fragewort</h4>
  Ein Fragewort zeigt, <b>was</b> du wissen willst: <span class="fr">qui</span> (wer), <span class="fr">comment</span> (wie) …
  <div class="tip" style="margin-top:8px"><span class="fr">C’est <span class="hl-q">qui</span>?</span> = Wer ist das?<br><span class="fr">Tu t’appelles <span class="hl-q">comment</span>?</span> = Wie heißt du?</div></div>
 <div class="way"><h4><span class="n" style="background:#16a34a">3</span>Mit&nbsp;<i>est-ce que</i></h4>
  <span class="fr">est-ce que</span> [ɛskə] ist ein <b>Frage-Signal</b>. Man übersetzt es nicht. Du kennst es aus festen Fragen:
  <div class="tip" style="margin-top:8px"><span class="fr">Comment <span class="hl-v">est-ce qu’</span>on dit …?</span><br><span class="fr">Qu’<span class="hl-v">est-ce qu’</span>il y a?</span></div></div>

 <div class="w" style="background:#2563eb"><b class="fr" style="color:#fff">Comment …?</b><span>Wie …?</span><br><span class="ipa" style="color:#fff">[kɔmɑ̃]</span></div>

<tr><td class="fr">Ça va?</td><td><span class="ipa">[sava]</span> – <b>ç</b> klingt wie ein stimmloses <b>s</b></td><td>{{speak:Ça va?}}</td></tr>

lesson:`<p><span class="fr">Qu’est-ce que …?</span> <span class="ipa">[kɛskə]</span> heißt <b>Was …?</b> Danach kommen eine <b>Person</b> und ein <b>Verb</b>:</p>
<table class="t"><tr><th>Frage</th><th>Deutsch</th><th>Antwort</th></tr>

const TTS=('speechSynthesis' in window)&&typeof window.SpeechSynthesisUtterance!=='undefined';

if(TTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
const ttsText=t=>strip(t).replace(/[«»]/g,'').replace(/\bM\. /g,'Monsieur ').replace(/B\.D\./g,'BD').replace(/ – /g,', ').replace(/…/g,'');

function speak(texts,btn){
 if(!TTS)return; try{speechSynthesis.cancel();}catch(e){}
 if(playingBtn)playingBtn.classList.remove('playing');
 texts=[].concat(texts);let i=0;playingBtn=btn||null;if(btn)btn.classList.add('playing');
 const next=()=>{if(i>=texts.length){if(btn)btn.classList.remove('playing');return;}
  const u=new SpeechSynthesisUtterance(ttsText(texts[i++]));u.lang='fr-FR';u.rate=.78;if(frVoice)u.voice=frVoice;
  u.onend=()=>setTimeout(next,350);u.onerror=()=>{if(btn)btn.classList.remove('playing');};
  try{speechSynthesis.speak(u);}catch(e){if(btn)btn.classList.remove('playing');}};
 next();

/* ---------- Vergleichen (tolerant) ---------- */
function norm(s,keepAcc){
 s=String(s).toLowerCase().replace(/[’'`´ʼ]/g,"'").replace(/[«»"“”„?!.,:;–—]/g,' ').replace(/-/g,'-');
 s=s.replace(/'\s+/g,"'").replace(/\s+/g,' ').trim();
 if(!keepAcc)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 return s;
}
function compare(input,answers){
 const a=answers.map(x=>norm(x,true)), i=norm(input,true);
 if(a.includes(i))return {ok:true};
 const al=answers.map(x=>norm(x,false)), il=norm(input,false);
 const k=al.indexOf(il); if(k>=0)return {ok:true,acc:answers[k]};
 return {ok:false};
}

 document.body.appendChild(c);setTimeout(()=>c.remove(),3500);}

 const head=S.mode==='test'?'🏆 Abschlusstest':S.mode==='mix'?'🔀 Gemischt':S.mode==='single'?'Aufgabe':c.q;
 main.innerHTML=`<div class="ex-wrap"><div class="ex-top"><button class="btn ghost small" data-quit="1">✕</button><div class="pbar"><i style="width:${S.i/S.list.length*100}%"></i></div><span class="fred" style="color:#475569;white-space:nowrap">${S.i+1} / ${S.list.length}</span></div>
 <div class="ex-card fade" style="--c:${c.c}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="ex-type">${ti} ${tl}</span><span class="legend">${head}</span></div>
 <div class="ex-q">${e.q}</div><div id="exBody"></div>
 <div class="fb" id="fb"></div><div class="actions"><button class="btn" id="checkBtn" disabled>Prüfen</button></div></div></div>`;
 cur=RENDER[e.type](e,$('#exBody'));
 const btn=$('#checkBtn');
 btn.onclick=()=>{if(btn.dataset.next){next();return;}const r=cur.check();if(r==null)return;feedback(e,r);btn.textContent=S.i<S.list.length-1?'Weiter →':'Ergebnis ansehen';btn.dataset.next='1';btn.disabled=false;btn.classList.add(r.ok?'green':'red');btn.focus();};
}
function ready(v){const b=$('#checkBtn');if(b&&!b.dataset.next)b.disabled=!v;}
const PRAISE=['Super, richtig!','Très bien!','Genau!','Bravo!','Parfait!','Klasse!'];
function feedback(e,r){
 const fb=$('#fb');S.res.push({e,ok:r.ok});
 if(r.ok&&S.mode!=='single'){const p=chp(e.ch);p.solved[e.id]=1;save();}
 fb.className='fb show '+(r.ok?'ok':'bad');
 fb.innerHTML=`<div class="ico">${r.ok?'✓':'✗'}</div><div style="flex:1"><div class="ttl">${r.ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Leider nicht richtig.'}</div>
 ${r.ok?'':`<div class="sol">Richtig ist: <span class="fr">${r.sol}</span> ${/[a-zé]/i.test(strip(r.sol))&&!r.nosay?spkBtn(strip(r.sol)):''}</div>`}
 ${r.acc?`<div class="warnacc">✍️ Fast perfekt! Achte auf die <b>Akzente / Zeichen</b>: <span class="fr">${esc(r.acc)}</span></div>`:''}
 <div class="why">💡 ${e.why}</div></div>`;
}
function next(){S.i++;if(S.i>=S.list.length){go('result');}else renderEx();}

/* ---------- Aufgaben-Renderer ---------- */
const RENDER={};
function optsBlock(e,el,prefix=''){
 const opts=shuffle(e.o);let sel=null;
 el.innerHTML=prefix+'<div class="opts">'+opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')+'</div>';
 $$('.opt',el).forEach(b=>b.onclick=()=>{if(b.disabled)return;$$('.opt',el).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=opts[+b.dataset.i];ready(true);});
 return {check(){if(sel==null)return null;const ok=sel===e.o[0];$$('.opt',el).forEach(b=>{b.disabled=true;const o=opts[+b.dataset.i];if(o===e.o[0])b.classList.add('ok');else if(o===sel)b.classList.add('bad');});return {ok,sol:e.o[0]};}};
}
RENDER.mc=(e,el)=>optsBlock(e,el,e.room?`<div>${ROOM_SVG}</div>`:'');
RENDER.findq=(e,el)=>optsBlock(e,el,`<div class="prompt">💬 <span>${e.prompt}</span>${spkBtn(e.prompt)}</div><div class="ex-sub">Diese Antwort hast du gehört. Welche Frage wurde vorher gestellt?</div>`);
function gapSelects(e,text,gapOffset=0){
 return text.replace(/\{(\d+)\}/g,(m,k)=>{const g=e.gaps[+k];const o=shuffle(g);return `<select class="gapsel" data-g="${k}" aria-label="Lücke ${+k+1}"><option value="">…</option>${o.map(x=>`<option value="${esc(x)}">${x}</option>`).join('')}</select>`;});
}
function gapCheck(e,el){const ss=$$('select.gapsel',el);if(ss.some(s=>!s.value))return null;let ok=true;
 ss.forEach(s=>{const right=s.value===e.gaps[+s.dataset.g][0];s.classList.add(right?'ok':'bad');if(!right)ok=false;s.disabled=true;});return ok;}
function bindGaps(el){$$('select.gapsel',el).forEach(s=>s.onchange=()=>ready($$('select.gapsel',el).every(x=>x.value)));}
RENDER.gap=(e,el)=>{el.innerHTML=`<div class="ex-sub">Wähle in jeder Lücke das passende Wort.</div><div class="gaptext">${gapSelects(e,e.text)}</div>`;bindGaps(el);
 return {check(){const ok=gapCheck(e,el);if(ok==null)return null;return {ok,sol:e.text.replace(/\{(\d+)\}/g,(m,k)=>'<u>'+e.gaps[+k][0]+'</u>')};}};};
RENDER.dialog=(e,el)=>{let side={},n=0;
 el.innerHTML=`<div class="ex-sub">Wähle in jeder Lücke das passende Wort.</div><div class="dlg">`+e.lines.map(([w,t])=>{if(!(w in side))side[w]=n++%2;return `<div class="row ${side[w]?'r':''}"><div class="av">${CHARS[w]||''}${NAMES[w]||w}</div><div class="bub"><span class="tx" style="line-height:2.1">${gapSelects(e,t)}</span></div></div>`;}).join('')+'</div>';bindGaps(el);
 const full=e.lines.map(([w,t])=>t.replace(/\{(\d+)\}/g,(m,k)=>e.gaps[+k][0]));
 return {check(){const ok=gapCheck(e,el);if(ok==null)return null;return {ok,nosay:true,sol:e.lines.map(([w,t])=>`${NAMES[w]||w}: `+t.replace(/\{(\d+)\}/g,(m,k)=>'<u>'+e.gaps[+k][0]+'</u>')).join('<br>')+' '+spkBtn(full.join('||'))};}};};
const joinTok=a=>a.join(' ').replace(/\s+([?.!,])/g,'$1').replace(/’ /g,'’');
RENDER.order=(e,el)=>{
 let toks=e.tok.map((t,i)=>({t,i}));let sh;do{sh=shuffle(toks);}while(toks.length>2&&sh.every((x,k)=>x.i===k));
 el.innerHTML=`<div class="ex-sub">Tippe die Bausteine in der richtigen Reihenfolge an – oder ziehe sie mit der Maus nach oben. Antippen im oberen Feld legt einen Baustein zurück.</div>
 <div class="zone empty" id="zone" data-ph="Hier entsteht deine Frage …"></div><div class="pool" id="pool">${sh.map(x=>`<button class="tok" draggable="true" data-i="${x.i}">${x.t}</button>`).join('')}</div>`;
 const zone=$('#zone',el),pool=$('#pool',el);
 const upd=()=>{zone.classList.toggle('empty',!zone.children.length);ready(pool.children.length===0);};
 el.addEventListener('click',ev=>{const b=ev.target.closest('.tok');if(!b||b.disabled)return;(b.parentElement===pool?zone:pool).appendChild(b);upd();});
 let drag=null;
 el.addEventListener('dragstart',ev=>{const b=ev.target.closest('.tok');if(!b)return;drag=b;b.classList.add('dragging');try{ev.dataTransfer.setData('text/plain',b.dataset.i);ev.dataTransfer.effectAllowed='move';}catch(x){}});
 el.addEventListener('dragend',()=>{if(drag)drag.classList.remove('dragging');drag=null;zone.classList.remove('over');});
 [zone,pool].forEach(z=>{z.addEventListener('dragover',ev=>{ev.preventDefault();z.classList.add('over');});z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',ev=>{ev.preventDefault();z.classList.remove('over');if(!drag)return;const tgt=ev.target.closest('.tok');if(tgt&&tgt!==drag&&tgt.parentElement===z)z.insertBefore(drag,tgt);else z.appendChild(drag);upd();});});
 return {check(){if(pool.children.length)return null;const got=$$('.tok',zone).map(b=>b.textContent);$$('.tok',el).forEach(b=>{b.disabled=true;b.draggable=false;});
  const r=compare(joinTok(got),[joinTok(e.tok),...e.alts]);zone.classList.add(r.ok?'ok':'bad');return {ok:r.ok,sol:joinTok(e.tok)};}};};
RENDER.write=(e,el)=>{
 el.innerHTML=`<input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Schreibe hier auf Französisch …" aria-label="Antwort">
 <div class="acc">${['é','è','ê','à','ç','’','«','»','?'].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join('')}</div>
 <div class="legend" style="margin-top:6px">Tipp: Groß-/Kleinschreibung ist egal. Akzente bitte mitschreiben – die Knöpfe helfen dir.</div>`;
 const inp=$('#inp',el);inp.addEventListener('input',()=>ready(inp.value.trim().length>1));
 inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&inp.value.trim().length>1)$('#checkBtn').click();});
 $$('.acc button',el).forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,t=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(t);inp.focus();inp.setSelectionRange(s+1,s+1);ready(inp.value.trim().length>1);});
 setTimeout(()=>{if(window.innerWidth>700)inp.focus();},50);
 return {check(){if(inp.value.trim().length<2)return null;const r=compare(inp.value,e.ans);inp.classList.add(r.ok?'ok':'bad');inp.disabled=true;$$('.acc button',el).forEach(b=>b.disabled=true);return {ok:r.ok,acc:r.acc,sol:e.ans[0]};}};};
const PCOL=['#2563eb','#c8102e','#16a34a','#d97706','#7c3aed'];
RENDER.match=(e,el)=>{
 const L=shuffle(e.pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(e.pairs.map((p,i)=>({t:p[1],i})));
 el.innerHTML=`<div class="ex-sub">Tippe links eine Frage/ein Wort an und dann rechts das Passende. Zum Lösen eines Paares einfach noch einmal antippen.</div>
 <div class="match"><div class="col">${L.map(x=>`<button class="mi" data-side="L" data-i="${x.i}">${x.t}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="mi" data-side="R" data-i="${x.i}">${x.t}</button>`).join('')}</div></div>`;
 const pairs={};let selL=null;
 const paint=()=>{$$('.mi',el).forEach(b=>{b.style.borderColor='';b.style.background='';const t=b.querySelector('.tag');if(t)t.remove();b.classList.remove('sel');});
  let n=0;Object.entries(pairs).forEach(([l,r])=>{const col=PCOL[n%5];n++;[$(`.mi[data-side="L"][data-i="${l}"]`,el),$(`.mi[data-side="R"][data-i="${r}"]`,el)].forEach(b=>{b.style.borderColor=col;b.style.background=col+'14';b.insertAdjacentHTML('beforeend',`<span class="tag" style="background:${col}">${n}</span>`);});});
  if(selL!=null)$(`.mi[data-side="L"][data-i="${selL}"]`,el).classList.add('sel');ready(Object.keys(pairs).length===e.pairs.length);};
 $$('.mi',el).forEach(b=>b.onclick=()=>{if(b.disabled)return;const i=b.dataset.i;
  if(b.dataset.side==='L'){if(pairs[i]!=null){delete pairs[i];selL=null;}else selL=(selL===i?null:i);}
  else{const owner=Object.keys(pairs).find(k=>pairs[k]===i);if(owner!=null){delete pairs[owner];}else if(selL!=null){pairs[selL]=i;selL=null;}else{toast('Tippe zuerst links etwas an.');}}
  paint();});
 return {check(){if(Object.keys(pairs).length<e.pairs.length)return null;let ok=true;Object.entries(pairs).forEach(([l,r])=>{const g=l===r;if(!g)ok=false;[$(`.mi[data-side="L"][data-i="${l}"]`,el),$(`.mi[data-side="R"][data-i="${r}"]`,el)].forEach(b=>b.classList.add(g?'ok':'bad'));});
  $$('.mi',el).forEach(b=>b.disabled=true);return {ok,nosay:true,sol:e.pairs.map(p=>`${p[0]} → ${p[1]}`).join('<br>')};}};};
RENDER.click=(e,el)=>{
 el.innerHTML=`<div class="ex-sub">Tippe im Bild auf den richtigen Gegenstand.</div>${ROOM_SVG}`;let sel=null;
 $$('.ri',el).forEach(g=>{g.setAttribute('tabindex','0');g.setAttribute('role','button');const f=()=>{if(g.dataset.lock)return;$$('.ri',el).forEach(x=>x.classList.remove('bad'));$$('.ri',el).forEach(x=>x.style.filter='');g.style.filter='drop-shadow(0 0 6px #2563eb) drop-shadow(0 0 2px #2563eb)';sel=g.dataset.item;ready(true);};g.addEventListener('click',f);g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();f();}});});
 return {check(){if(!sel)return null;$$('.ri',el).forEach(g=>{g.dataset.lock=1;g.style.filter='';if(g.dataset.item===e.target)g.classList.add('ok');else if(g.dataset.item===sel)g.classList.add('bad');});
  return {ok:sel===e.target,sol:ROOM_ITEMS[e.target]+(sel!==e.target?` <span style="font-weight:500">(du hast ${ROOM_ITEMS[sel]} angeklickt)</span>`:''),nosay:true};}};};
RENDER.multi=(e,el)=>{
 const o=shuffle(e.o);el.innerHTML=`${ROOM_SVG}<div class="ex-sub">Tippe alle passenden Sätze an (mehrere sind richtig).</div><div class="chips">${o.map((x,i)=>`<button class="chipc" data-i="${i}">${x[0]}</button>`).join('')}</div>`;
 $$('.ri',el).forEach(g=>g.style.cursor='default');
 $$('.chipc',el).forEach(b=>b.onclick=()=>{if(b.disabled)return;b.classList.toggle('sel');ready($$('.chipc.sel',el).length>0);});
 return {check(){const s=$$('.chipc.sel',el);if(!s.length)return null;let ok=true;$$('.chipc',el).forEach(b=>{const x=o[+b.dataset.i];const on=b.classList.contains('sel');b.disabled=true;
  if(x[1]&&on)b.classList.add('ok');else if(!x[1]&&on){b.classList.add('bad');ok=false;}else if(x[1]&&!on){b.classList.add('miss');ok=false;}});
  return {ok,nosay:true,sol:e.o.filter(x=>x[1]).map(x=>x[0]).join(' ')};}};};

/* ---------- Ergebnis ---------- */
function medal(col,label){return `<svg class="medal" viewBox="0 0 120 120"><path d="M40,4 L60,48 L80,4 Z" fill="#c8102e"/><path d="M48,4 L60,32 L72,4Z" fill="#2563eb"/><circle cx="60" cy="74" r="38" fill="${col}" stroke="#fff" stroke-width="5"/><circle cx="60" cy="74" r="28" fill="none" stroke="#ffffff88" stroke-width="3"/><text x="60" y="82" text-anchor="middle" font-family="FredokaApp,sans-serif" font-size="${label.length>4?17:22}" font-weight="700" fill="#fff">${label}</text></svg>`;}
function result(){
 const n=S.list.length,k=S.res.filter(r=>r.ok).length,pct=Math.round(k/n*100);
 const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
 let extra='';
 if(S.mode==='chapter'){const p=chp(S.ch);p.best=Math.max(p.best||0,pct);save();}
 if(S.mode==='test'){P.test.runs++;P.test.best=Math.max(P.test.best??0,pct);P.test.stars=Math.max(P.test.stars,stars);save();}
 const badge=stars===3?medal('#f59e0b','GOLD'):stars===2?medal('#94a3b8','SILBER'):stars===1?medal('#b45309','BRONZE'):'';
 const title=stars===3?'Excellent! Du bist ein Frage-Profi!':stars===2?'Très bien! Das sitzt schon gut.':stars===1?'Pas mal! Noch ein bisschen üben.':'Courage! Übe die Kapitel noch einmal.';
 const wrong=S.res.filter(r=>!r.ok);const byCh={};wrong.forEach(r=>{(byCh[r.e.ch]=byCh[r.e.ch]||[]).push(r.e);});
 let rev='';
 if(wrong.length){rev=`<div class="review"><h3 class="fred" style="color:#c8102e;margin:0">📌 Das solltest du noch einmal üben</h3>`+Object.entries(byCh).map(([ch,es])=>{const c=CHMAP[ch];return `<div class="it"><div class="t"><b class="fr">${c.q}</b> <span style="color:#64748b">– ${c.de}</span><br><span class="legend">${es.length} Fehler: ${es.map(x=>TYPE[x.type][0]).join(', ')}</span></div><button class="btn small" data-open="${ch}">Zur Lektion</button><button class="btn small ghost" data-practice="${ch}">Üben</button></div>`;}).join('')+`</div>`;}
 else rev=`<div class="tip" style="margin-top:16px">🎉 Alles richtig – fantastique!</div>`;
 main.innerHTML=`<div class="ex-wrap"><div class="ex-card result fade">${S.mode==='test'?'<div class="fred" style="color:#c8102e;letter-spacing:.08em">ABSCHLUSSTEST</div>':''}
 ${badge}<div class="stars">${[0,1,2].map(i=>`<span class="s ${i<stars?'on':''}" style="animation-delay:${i*.2}s">★</span>`).join('')}</div>
 <div class="score">${k} / ${n} Punkte</div><div style="font-size:19px;color:#475569">${pct} % richtig · ${title}</div>
 ${S.mode==='chapter'?`<div class="legend" style="margin-top:8px">${pct>=70?'✓ Kapitel geschafft! Der Haken ist gesetzt.':'Für den Haken brauchst du mindestens 70 %.'}</div>`:''}${rev}
 <div class="toolbar" style="justify-content:center">${S.mode==='test'?'<button class="btn red" data-test="1">↻ Test wiederholen</button>':S.mode==='chapter'?`<button class="btn" data-practice="${S.ch}">↻ Noch einmal (neue Reihenfolge)</button>`:S.mode==='mix'?'<button class="btn" data-mix="1">↻ Neue Mischung</button>':''}<button class="btn ghost" data-home="1">Zur Übersicht</button></div></div></div>`;
 if(stars>=2&&S.mode!=='single')confetti();
}

/* ---------- Navigation ---------- */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-open],[data-practice],[data-test],[data-home],[data-mix],[data-reset],[data-quit]');if(!b)return;
 if(b.dataset.open)go('lesson',b.dataset.open);else if(b.dataset.practice)startChapter(b.dataset.practice);else if(b.dataset.test)startTest();else if(b.dataset.home)go('home');else if(b.dataset.mix)startMix();
 else if(b.dataset.quit){if(S&&S.res.length&&S.mode!=='single'&&!confirm('Übung abbrechen? Dein Ergebnis wird nicht gespeichert.'))return;go('home');}
 else if(b.dataset.reset){if(confirm('Willst du wirklich deinen ganzen Fortschritt löschen?')){P={ch:{},test:{best:null,stars:0,runs:0}};save();go('home');toast('Fortschritt zurückgesetzt.');}}});
$('#logo').onclick=()=>go('home');
go('home');
})();

</script>
</body></html>
